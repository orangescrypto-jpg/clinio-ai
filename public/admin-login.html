<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinio AI - Admin Login</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, sans-serif; 
      background: #f0f2f5; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 { color: #2563eb; margin-bottom: 8px; font-size: 28px; }
    p { color: #6b7280; margin-bottom: 32px; font-size: 14px; }
    button {
      width: 100%;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }
    button:hover { background: #f9fafb; border-color: #2563eb; }
    button img { width: 24px; height: 24px; }
    .error { color: #ef4444; margin-top: 16px; font-size: 14px; }
    .success { color: #22c55e; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛠️ Clinio AI Admin</h1>
    <p>Sign in with your Google account to manage content</p>
    
    <button onclick="login()">
      <img src="https://www.google.com/favicon.ico" alt="Google">
      Sign in with Google
    </button>
    
    <div id="message"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCN6PHO9vXgj2UcdUpQ76fPPigkfwmKhEg",
      authDomain: "clinio-ai.firebaseapp.com",
      projectId: "clinio-ai",
      storageBucket: "clinio-ai.appspot.com",
      messagingSenderId: "1092363872596",
      appId: "1:1092363872596:web:4dcb10a7bc89e54a78c0c1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          document.getElementById('message').className = 'success';
          document.getElementById('message').textContent = '✅ Login successful! Redirecting...';
          
          // Store login status
          localStorage.setItem('adminLoggedIn', 'true');
          localStorage.setItem('adminEmail', user.email);
          
          // Redirect to admin panel after 1 second
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 1000);
        })
        .catch((error) => {
          document.getElementById('message').className = 'error';
          document.getElementById('message').textContent = '❌ Login failed: ' + error.message;
        });
    }

    // Check if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminEmail', user.email);
      }
    });
  </script>
</body>
</html>
